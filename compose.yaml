services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: ["go", "run", "./cmd/server"]
    environment:
      PORT: 8080
      STORAGE_DRIVER: ${STORAGE_DRIVER:-memory}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./apps/backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    working_dir: /app
    command: ["pnpm", "--filter", "@market/frontend", "dev", "--host", "0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://backend:8080
      WATCH_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - frontend_app_node_modules:/app/apps/frontend/node_modules
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  frontend_app_node_modules:
  frontend_node_modules:
