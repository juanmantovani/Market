services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market}
      POSTGRES_DB: ${POSTGRES_DB:-market}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-market} -d ${POSTGRES_DB:-market}"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # One-shot: applies every migration in migrations/ with Goose and exits.
  # backend waits for it, so a fresh `docker compose up` always has an
  # up-to-date schema, whether or not STORAGE_DRIVER is postgres.
  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://market:market@db:5432/market?sslmode=disable}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: ["go", "run", "./cmd/server"]
    environment:
      PORT: 8080
      STORAGE_DRIVER: ${STORAGE_DRIVER:-memory}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DATABASE_URL: ${DATABASE_URL:-postgres://market:market@db:5432/market?sslmode=disable}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./apps/backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.dev
    working_dir: /app
    command: ["pnpm", "--filter", "@market/frontend", "dev", "--host", "0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://backend:8080
      WATCH_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend:/app/apps/frontend
      - frontend_app_node_modules:/app/apps/frontend/node_modules
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  db_data:
  frontend_app_node_modules:
  frontend_node_modules:
